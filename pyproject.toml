[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sortex"
version = "0.3.0"
description = "Hybrid cloud-edge waste classification platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "torchvision>=0.17", "Pillow>=10.0", "numpy>=1.26"]

[project.optional-dependencies]
server = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "sqlalchemy>=2.0", "psycopg[binary]>=3.2", "celery>=5.4", "redis>=5.0", "pydantic-settings>=2.5", "python-multipart>=0.0.9"]
edge = ["requests>=2.32"]
dev = ["pytest>=8.0", "ruff>=0.6", "httpx>=0.27"]

[project.scripts]
sortex = "sortex.cli:main"
sortex-edge = "sortex_edge.client:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = ["F", "UP"]
